<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087C55" />
    <title>GoBert — Hors ligne / Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5EF; color: #242B29; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.25rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.4rem; margin: 1rem 0 .25rem; }
      p { color: #4A5552; line-height: 1.5; margin: .25rem 0; }
      button { margin-top: 1.25rem; height: 48px; padding: 0 1.5rem; border: 0; border-radius: 14px; background: #087C55; color: #fff; font-weight: 700; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-mark.png" alt="GoBert" />
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion. Vos réservations en attente seront envoyées automatiquement.</p>
      <p><em>You are offline. Pending bookings will be sent automatically when you reconnect.</em></p>
      <button onclick="location.reload()">Réessayer · Retry</button>
    </main>
  </body>
</html>
